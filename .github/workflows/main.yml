name: Build Edge Impulse Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract Edge Impulse ZIP
        run: |
          cd example_camera_inference/app/src/main/cpp
          echo "ZIP files:"
          find . -maxdepth 1 -type f -name "*.zip" -print
          ZIPFILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIPFILE" ]; then
            echo "ERROR: Edge Impulse ZIP not found"
            exit 1
          fi
          unzip -o "$ZIPFILE" -d edge_impulse_temp
          cp -r edge_impulse_temp/edge-impulse-sdk . || true
          cp -r edge_impulse_temp/model-parameters . || true
          cp -r edge_impulse_temp/tflite-model . || true
          echo "Extracted files:"
          ls -la

      - name: Make Gradle executable
        run: chmod +x example_camera_inference/gradlew
      - name: Download TensorFlow Lite libraries
        run: |
          cd example_camera_inference/app/src/main/cpp/tflite
          chmod +x download_tflite_libs.sh
          sh download_tflite_libs.sh
      - name: Build APK
        working-directory: example_camera_inference
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nyanco-edge-impulse-app
          path: example_camera_inference/app/build/outputs/apk/debug/*.apk
